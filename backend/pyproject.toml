[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-doctor-backend"
version = "0.1.0"
description = "Secure API diagnostics service"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "httpx>=0.28,<1", "pydantic>=2.11,<3", "uvicorn[standard]>=0.35,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
